spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 200MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://localhost:3306/yozora?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    redis:
      host: localhost
      port: 6379
      database: 2
  druid:
    initial-size: 5
    min-idle: 5
    max-active: 20

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
